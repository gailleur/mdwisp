<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>mdwisp</title>
  </head>
  <body>
    <header class="bar" id="bar" data-tauri-drag-region>
      <div class="tabs" id="tabs" role="tablist" aria-label="Open documents" data-tauri-drag-region></div>
      <!-- Never covered by tabs: the window can always be dragged from here. -->
      <div class="bar__grip" data-tauri-drag-region aria-hidden="true"></div>
    </header>
    <div class="banner banner--app" id="app-banner" role="status" hidden></div>
    <div class="body" id="body">
      <main class="viewer" id="viewer">
        <section class="empty" id="empty">
          <svg class="empty__mark" viewBox="0 0 1024 1024" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="64">
              <path d="M216 760V380H504V760"/>
              <path d="M360 380V760"/>
              <path d="M600 380H744V760H600Z"/>
              <path d="M744 412V330"/>
            </g>
            <rect x="712" y="200" width="64" height="130" fill="currentColor" opacity="0.45"/>
            <rect x="684" y="218" width="28" height="28" fill="currentColor"/>
            <rect x="664" y="166" width="16" height="16" fill="currentColor"/>
            <rect x="652" y="126" width="8" height="8" fill="currentColor"/>
          </svg>
          <p class="empty__name">mdwisp</p>
          <p class="empty__hint">markdown, quietly.</p>
          <div class="empty__actions">
            <button class="empty__action" id="empty-open" type="button">Open<kbd>⌘O</kbd></button>
            <button class="empty__action" id="empty-new" type="button">New<kbd>⌘N</kbd></button>
          </div>
          <p class="empty__drop">or drop a .md file here · <kbd>⌘/</kbd> help</p>
        </section>
      </main>
    </div>
    <footer class="status" id="status" hidden></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
