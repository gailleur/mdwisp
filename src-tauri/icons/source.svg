<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="1"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#0a0a0a"/>
    <!-- faint grid, as on the Gailleur Labs mark -->
    <g stroke="#1f1f1f" stroke-width="4">
      <path d="M0 232H1024M0 512H1024M0 792H1024M232 0V1024M512 0V1024M792 0V1024"/>
    </g>
    <rect width="1024" height="1024" fill="url(#halo)"/>

    <!-- squared "md" in the stroke of the Gailleur Labs "G"; the ascender of
         the d rises and dissolves into pixels: the wisp -->
    <g fill="none" stroke="#4ade80" stroke-width="64" stroke-linejoin="miter" stroke-linecap="butt" filter="url(#glow)">
      <!-- m -->
      <path d="M216 760V380H504V760"/>
      <path d="M360 380V760"/>
      <!-- d: bowl, then the solid start of the ascender -->
      <path d="M600 380H744V760H600Z"/>
      <path d="M744 412V330"/>
    </g>
    <rect x="712" y="200" width="64" height="130" fill="url(#rise)" filter="url(#glow)"/>
    <g fill="#4ade80" filter="url(#glow)">
      <rect x="684" y="218" width="28" height="28"/>
      <rect x="664" y="166" width="16" height="16"/>
      <rect x="652" y="126" width="8" height="8"/>
    </g>

    <!-- corner nodes -->
    <rect x="792" y="232" width="36" height="36" fill="#4ade80"/>
    <rect x="196" y="792" width="36" height="36" fill="#4ade80"/>
  </g>
</svg>
