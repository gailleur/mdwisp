name: Linux smoke test

# Installs the published Linux packages on real Ubuntu runners, opens a
# document under a virtual display, and runs Help ▸ Check for Updates…
# against the live endpoint. Screenshots are uploaded as artifacts so a
# person can look at the result. Runs when a GitHub release is published,
# for that release and the one before it; run it by hand to test any pair.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to test (empty: the latest)"
        default: ""
      previous:
        description: "Older release to install first, so the update check finds the newer one (empty: the one before)"
        default: ""
      try_install:
        description: "Also click install in the update banner"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.kind }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kind: deb
          - os: ubuntu-24.04
            kind: deb
          - os: ubuntu-24.04
            kind: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool imagemagick x11-utils dbus-x11 gdb psmisc
          if [ "${{ matrix.kind }}" = appimage ]; then
            # FUSE mounts the image; libEGL is a system library WebKitGTK
            # links that every desktop install has but a bare runner lacks.
            sudo apt-get install -y libegl1 libgl1
            sudo apt-get install -y libfuse2t64 2>/dev/null || sudo apt-get install -y libfuse2
          fi
      - name: Pick the releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName,publishedAt > releases.json
          [ -n "$TAG" ] || TAG=$(jq -r 'sort_by(.publishedAt) | last | .tagName // empty' releases.json)
          if [ -z "$PREVIOUS" ]; then
            PREVIOUS=$(jq -r --arg tag "$TAG" '
              (map(select(.tagName == $tag)) | first | .publishedAt) as $at
              | if $at == null then empty else map(select(.publishedAt < $at)) | sort_by(.publishedAt) | last | .tagName // empty end
            ' releases.json)
          fi
          echo "testing $TAG as an update from ${PREVIOUS:-nothing}"
          [ -n "$TAG" ] && [ -n "$PREVIOUS" ]
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.kind }}" in
            deb) pattern='mdwisp-linux-amd64.deb' ;;
            appimage) pattern='mdwisp-linux-x86_64.AppImage' ;;
          esac
          gh release download "$PREVIOUS" -R "$GITHUB_REPOSITORY" -p "$pattern" -D prev
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$pattern" -D new
          ls -la prev new
      - name: Install the older release
        run: |
          if [ "${{ matrix.kind }}" = deb ]; then
            sudo apt-get install -y ./prev/*.deb
            dpkg -s mdwisp | grep -E '^(Version|Depends)'
            echo "BIN=/usr/bin/mdwisp" >> "$GITHUB_ENV"
          else
            chmod +x prev/*.AppImage
            echo "BIN=$PWD/prev/mdwisp-linux-x86_64.AppImage" >> "$GITHUB_ENV"
          fi
          "$BIN" --version 2>/dev/null || true
      - name: Open a document and check for updates
        env:
          TRY_INSTALL: ${{ inputs.try_install && '1' || '' }}
        run: |
          cat > sample.md <<'EOF'
          # Smoke test

          A paragraph with **bold**, *italic* and `code`.

          - one
          - two

          | a | b |
          |---|---|
          | 1 | 2 |
          EOF
          chmod +x scripts/linux-smoke.sh
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/linux-smoke.sh "$BIN" "$PWD/sample.md" shots
      - name: Report what is installed afterwards
        if: always()
        run: |
          if [ "${{ matrix.kind }}" = deb ]; then
            dpkg -s mdwisp | grep '^Version' || true
          else
            # The updater overwrites the running AppImage in place.
            sha256sum prev/*.AppImage new/*.AppImage
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shots-${{ matrix.kind }}-${{ matrix.os }}
          path: shots
