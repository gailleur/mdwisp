name: Release

# Pushing a tag like v0.1.0 builds the installers on all three platforms
# and attaches them, with a SHA256SUMS file, to a *draft* GitHub release.
# Publishing the draft is a manual step so the notes can be written first.
#
# macOS builds are signed with the Developer ID certificate and notarized
# by Apple when the APPLE_* secrets are present; without them the build is
# unsigned, which is what a fork gets. Tauri reads the variables itself.
# Windows builds are not signed yet.
#
# When TAURI_SIGNING_PRIVATE_KEY is present the build also produces the
# update bundles and their minisign signatures, and the release gets a
# latest.json manifest; Help ▸ Check for Updates… in the app reads it via
# https://mdwisp.com/latest.json. Forks without the key get plain installers.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # Nothing is built, and no secret is touched, unless the tag names the
  # version in the tree, points at a commit that is on main, and that commit
  # passed CI. A tag pushed right after a merge waits for CI to finish.
  check:
    name: Tag is releasable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag matches the version fields
        run: bash scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Tagged commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          # Up to an hour, checking every 30 seconds. CI on main runs for the
          # newest commit of each push, so tag that one: a commit that never
          # had a run of its own is given ten minutes to show one, then fails.
          for attempt in $(seq 1 120); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=ci-ok&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | first | "\(.status) \(.conclusion)"')
            echo "attempt $attempt: ci-ok is ${state:-missing}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*)
                echo "::error::CI did not pass on $sha"
                exit 1 ;;
              "null null" | "")
                if [ "$attempt" -ge 20 ]; then
                  echo "::error::no CI run found for $sha; tag the newest commit on main"
                  exit 1
                fi ;;
            esac
            sleep 30
          done
          echo "::error::CI on $sha did not finish within an hour"
          exit 1

  build:
    name: Build (${{ matrix.name }})
    needs: check
    # The signing secrets live in this environment, which only v* tags may
    # use, so a workflow on any other ref cannot read them.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # The secrets context is not allowed in step conditions, so expose
      # "are the Apple secrets configured" as a plain job variable.
      APPLE_SIGNING: ${{ secrets.APPLE_API_KEY_CONTENT != '' }}
      UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apple notarization key
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          if [ "$UPDATER_SIGNING" = "true" ]; then
            pnpm tauri build --ci --config src-tauri/tauri.release.conf.json
          else
            pnpm tauri build --ci
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # When CI=true the bundler skips the Finder step that lays out the
          # disk image (background, 128 pt icons, hidden extension). The
          # hosted macOS runners have a Finder session, so run it anyway.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          # Tauri notarizes and staples the app but only signs the disk
          # image; notarize that too so the dmg itself passes Gatekeeper.
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          # The update bundle is the same app, archived; make sure the copy
          # inside it carries the notarization ticket too.
          archive=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' | head -1)
          if [ -n "$archive" ]; then
            mkdir -p "$RUNNER_TEMP/archive" && tar -xzf "$archive" -C "$RUNNER_TEMP/archive"
            codesign --verify --strict "$RUNNER_TEMP/archive"/*.app
            xcrun stapler validate "$RUNNER_TEMP/archive"/*.app
          fi
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          # Update bundles and their signatures, when the build signed them.
          # Only the macOS one is a separate file (the app archived); the
          # others are the installers above, so just their signatures move.
          find src-tauri/target/release/bundle \
            \( -name '*.AppImage.sig' -o -name '*.deb.sig' -o -name '*.rpm.sig' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' \) \
            -exec cp {} out/ \;
          archive=$(find src-tauri/target/release/bundle -maxdepth 2 -name '*.app.tar.gz' | head -1)
          if [ -n "$archive" ] && [ -f "$archive.sig" ]; then
            cp "$archive" out/mdwisp-macos-arm64.app.tar.gz
            cp "$archive.sig" out/mdwisp-macos-arm64.app.tar.gz.sig
          fi
          # Versionless copies give mdwisp.com stable "latest" download
          # links. They are byte-identical to the versioned files.
          for f in out/*; do
            case "$f" in
              *.sig)        ;;
              *.dmg)        cp "$f" out/mdwisp-macos-arm64.dmg ;;
              *.AppImage)   cp "$f" out/mdwisp-linux-x86_64.AppImage ;;
              *.deb)        cp "$f" out/mdwisp-linux-amd64.deb ;;
              *.rpm)        cp "$f" out/mdwisp-linux-x86_64.rpm ;;
              *-setup.exe)  cp "$f" out/mdwisp-windows-x64-setup.exe ;;
              *.msi)        cp "$f" out/mdwisp-windows-x64.msi ;;
            esac
          done
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Update manifest
        run: |
          if ls out/*.sig >/dev/null 2>&1; then
            bash scripts/latest-manifest.sh "$GITHUB_REF_NAME" out
          else
            echo "no update signatures; skipping latest.json"
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft --verify-tag \
            --title "mdwisp $GITHUB_REF_NAME" \
            --notes "Installers for macOS, Linux and Windows. Verify with \`sha256sum -c SHA256SUMS\`. The macOS app is signed and notarized by Apple; Windows builds are not signed yet, see the README for how to open them. From 0.1.4 on, Help ▸ Check for Updates… in the app installs new releases; the \`.sig\` files and \`latest.json\` are what it verifies against."
