name: Release

# Pushing a tag like v0.1.0 builds the installers on all three platforms
# and attaches them, with a SHA256SUMS file, to a *draft* GitHub release.
# Publishing the draft is a manual step so the notes can be written first.
#
# macOS builds are signed with the Developer ID certificate and notarized
# by Apple when the APPLE_* secrets are present; without them the build is
# unsigned, which is what a fork gets. Tauri reads the variables itself.
# Windows builds are not signed yet.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with tauri.conf.json, package.json and Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag conf=$conf pkg=$pkg cargo=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ]

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # The secrets context is not allowed in step conditions, so expose
      # "are the Apple secrets configured" as a plain job variable.
      APPLE_SIGNING: ${{ secrets.APPLE_API_KEY_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apple notarization key
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - run: pnpm tauri build --ci
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          # Tauri notarizes and staples the app but only signs the disk
          # image; notarize that too so the dmg itself passes Gatekeeper.
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          # Versionless copies give mdwisp.com stable "latest" download
          # links. They are byte-identical to the versioned files.
          for f in out/*; do
            case "$f" in
              *.dmg)        cp "$f" out/mdwisp-macos-arm64.dmg ;;
              *.AppImage)   cp "$f" out/mdwisp-linux-x86_64.AppImage ;;
              *.deb)        cp "$f" out/mdwisp-linux-amd64.deb ;;
              *.rpm)        cp "$f" out/mdwisp-linux-x86_64.rpm ;;
              *-setup.exe)  cp "$f" out/mdwisp-windows-x64-setup.exe ;;
              *.msi)        cp "$f" out/mdwisp-windows-x64.msi ;;
            esac
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft --verify-tag \
            --title "mdwisp $GITHUB_REF_NAME" \
            --notes "Installers for macOS, Linux and Windows. Verify with \`sha256sum -c SHA256SUMS\`. The macOS app is signed and notarized by Apple; Windows builds are not signed yet, see the README for how to open them."
