name: App Store

# Builds the sandboxed, universal macOS app, wraps it in a signed installer
# package and uploads it to App Store Connect. Runs when a GitHub release is
# published, for that release's tag; submitting for review stays a manual
# step on appstoreconnect.apple.com. To upload again by hand, run it from
# the Actions tab and pick the tag under "Use workflow from": the secrets
# live in the `release` environment, which only v* tags may use.
#
# Secrets: APPSTORE_DIST_P12 and APPSTORE_INSTALLER_P12 (base64 .p12 files
# holding the "Apple Distribution" and "3rd Party Mac Developer Installer"
# identities, both protected by APPSTORE_P12_PASSWORD), APPSTORE_APP_IDENTITY,
# APPSTORE_INSTALLER_IDENTITY, APPSTORE_PROVISIONING_PROFILE (base64
# .provisionprofile), and the APPLE_API_KEY / APPLE_API_ISSUER /
# APPLE_API_KEY_CONTENT trio shared with release.yml for the upload.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Provisioning profile and API key
        env:
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          printf '%s' "$APPSTORE_PROVISIONING_PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Signing identities
        # A throwaway keychain holding both identities, so that Tauri
        # (codesign) and productbuild find them by name.
        env:
          APPSTORE_DIST_P12: ${{ secrets.APPSTORE_DIST_P12 }}
          APPSTORE_INSTALLER_P12: ${{ secrets.APPSTORE_INSTALLER_P12 }}
          APPSTORE_P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/appstore.keychain-db"
          kcpw=$(uuidgen)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          for name in DIST INSTALLER; do
            eval "printf '%s' \"\$APPSTORE_${name}_P12\"" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$kc" -P "$APPSTORE_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
      - name: Build sandboxed universal app
        # Tauri signs with APPLE_SIGNING_IDENTITY from the keychain search
        # list. No notarization variables are set here on purpose: App
        # Store builds are not notarized.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPSTORE_APP_IDENTITY }}
        run: |
          pnpm tauri build --ci --no-bundle --target universal-apple-darwin
          pnpm tauri bundle --ci --bundles app --target universal-apple-darwin \
            --config src-tauri/tauri.appstore.conf.json
      - name: Check entitlements
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$app" >> "$GITHUB_ENV"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" | grep -q app-sandbox
          lipo -info "$app/Contents/MacOS/mdwisp"
      - name: Build installer package
        env:
          APPSTORE_INSTALLER_IDENTITY: ${{ secrets.APPSTORE_INSTALLER_IDENTITY }}
        run: |
          xcrun productbuild --sign "$APPSTORE_INSTALLER_IDENTITY" \
            --component "$app" /Applications mdwisp.pkg
          ls -l mdwisp.pkg
      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # altool looks for the key under ~/.private_keys or ./private_keys.
          mkdir -p ~/.private_keys
          cp "$APPLE_API_KEY_PATH" ~/.private_keys/AuthKey_"$APPLE_API_KEY".p8
          xcrun altool --upload-app --type macos --file mdwisp.pkg \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
